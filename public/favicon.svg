<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="taltrix-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <linearGradient id="taltrix-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Outer Rounded Container -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#taltrix-bg)" />
  
  <!-- Subtle Top Highlight -->
  <rect x="32" y="32" width="448" height="224" rx="112" fill="url(#taltrix-glow)" />

  <!-- Code / Terminal Visualizer Emblem (>_) -->
  <path d="M144 160 L248 256 L144 352" stroke="#ffffff" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <line x1="272" y1="352" x2="368" y2="352" stroke="#22d3ee" stroke-width="44" stroke-linecap="round" />
</svg>
